[project]
name = "pitch-utils"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tanzhijian", email = "tanzhijianorg@outlook.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
    "ty>=0.0.39",
]

[tool.ruff]
lint.select = ["E", "F", "I"]
line-length = 79

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests",]
